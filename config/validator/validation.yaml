App\Entity\Location:
    properties:
        city:
            - NotBlank: { groups: [create, edit] }
            - Length: { min: 2, max: 255, groups: [create, edit] }
        country:
            - NotBlank: { groups: [create, edit] }
        latitude:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -90, max: 90, groups: [create, edit] }
        longitude:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -180, max: 180, groups: [create, edit] }

App\Entity\Measurements:
    properties:
        location:
            - NotNull: { groups: [create, edit] }
        date:
            - NotNull: { groups: [create, edit] }
        celsius:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -60, max: 60, groups: [create, edit] }
        pressure:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: 870, max: 1085, groups: [create, edit] }
        humidity:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: 0, max: 100, groups: [create, edit] }
